name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 compiler not found' }
          "ISCC_EXE=$compiler" >> $env:GITHUB_ENV
      - name: Test, build and verify installer
        run: python Packaging/build_windows.py
      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: DTL-Document-Processor-Windows-x64
          path: Build/Windows/Installer/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: Build/Windows/test-results.xml
          if-no-files-found: ignore
